<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Holdline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#03020c;font-family:'Exo 2',system-ui,sans-serif;color:#c9d4ff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
.stage{position:relative;aspect-ratio:9/16;height:min(calc(100vh - 56px),calc((100vw - 20px)*16/9));border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px rgba(45,226,230,.35),0 0 40px rgba(45,226,230,.18)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{font-size:13px;color:#7d8bbf;text-align:center;line-height:1.4}
.hint kbd{background:#0c0a22;color:#2de2e6;border:1px solid rgba(45,226,230,.5);border-radius:5px;padding:1px 6px;font-family:inherit;font-weight:500}
.gear{position:absolute;bottom:10px;left:10px;width:38px;height:38px;border-radius:50%;border:none;background:#0c0a22;color:#2de2e6;border:1px solid rgba(45,226,230,.6);font-size:19px;cursor:pointer;box-shadow:0 0 12px rgba(45,226,230,.35);z-index:3}
.panel{position:absolute;bottom:56px;left:10px;width:230px;background:#0c0a22;color:#c9d4ff;border:1px solid rgba(45,226,230,.5);border-radius:14px;padding:14px 14px 10px;box-shadow:0 0 20px rgba(45,226,230,.25);z-index:3;display:none}
.panel.open{display:block}
.panel h3{font-size:15px;font-weight:600;margin-bottom:8px}
.row{margin-bottom:9px}
.row label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.row input{width:100%;accent-color:#ff2975}
.panel button{width:100%;border:none;background:#ff2975;color:#fff;border-radius:8px;padding:7px;font-family:inherit;font-size:13px;cursor:pointer;margin-top:2px}
.panel hr{border:none;border-top:1px solid rgba(45,226,230,.3);margin:12px 0 10px}
.panel button.alt{background:#2de2e6;color:#07061a;font-weight:600}
@media (pointer:coarse){.hint.desk{display:none}}
@media (pointer:fine){.hint.mob{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <button class="gear" id="gear" aria-label="Réglages">⚙</button>
  <div class="panel" id="panel">
    <h3>Réglages du feeling</h3>
    <div class="row"><label>Gravité <span id="v-gravity"></span></label><input type="range" id="gravity" min="700" max="2600" step="50"></div>
    <div class="row"><label>Vitesse des flippers <span id="v-flipSpeed"></span></label><input type="range" id="flipSpeed" min="12" max="50" step="1"></div>
    <div class="row"><label>Rebond sur flipper <span id="v-flipBounce"></span></label><input type="range" id="flipBounce" min="0" max="0.8" step="0.05"></div>
    <div class="row"><label>Puissance bumpers <span id="v-bumperKick"></span></label><input type="range" id="bumperKick" min="200" max="1200" step="25"></div>
    <div class="row"><label>Puissance slingshots <span id="v-slingKick"></span></label><input type="range" id="slingKick" min="100" max="900" step="25"></div>
    <div class="row"><label>Vitesse des ennemis <span id="v-enemySpeed"></span></label><input type="range" id="enemySpeed" min="0.3" max="2" step="0.1"></div>
    <div class="row"><label>Dégâts de la bille <span id="v-ballDmg"></span></label><input type="range" id="ballDmg" min="0.3" max="3" step="0.1"></div>
    <div class="row"><label>Son <span id="v-sound"></span></label><input type="range" id="sound" min="0" max="1" step="0.1"></div>
    <button id="reset">Valeurs par défaut</button>
    <hr>
    <div class="row"><label>Sauter à la vague <span id="v-jump"></span></label><input type="range" id="jump" min="1" max="20" step="1" value="5"></div>
    <button class="alt" id="jumpBtn">Nouvelle partie avec bonus aléatoires</button>
  </div>
</div>
<p class="hint desk"><kbd>←</kbd>/<kbd>Q</kbd> flipper gauche · <kbd>→</kbd>/<kbd>D</kbd> flipper droit · maintiens <kbd>Espace</kbd> pour lancer · <kbd>N</kbd> secouer la table</p>
<p class="hint mob">Moitié gauche / droite de l'écran = flippers · maintiens l'écran pour lancer la bille</p>

<script>
const coarse=matchMedia('(pointer:coarse)').matches;
const W=540,VH=960,H=VH,WH=2880,BOT=1920,BR=9,TAU=Math.PI*2;
const DEF={gravity:1100,flipSpeed:24,flipBounce:0.25,bumperKick:480,slingKick:330,enemySpeed:1,ballDmg:1,sound:0.6};
const P={...DEF};
const PAL={cream:'#07061a',paper:'#e8fbff',coral:'#ff2975',coralLight:'#ff7ab6',yellow:'#fdfd2f',teal:'#2de2e6',tealLight:'#7ff9ff',navy:'#c9d4ff',purple:'#b388ff',sun:'#ff9f43'};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ================= Géométrie du monde ================= */
const segs=[];
function seg(ax,ay,bx,by,o={}){const s={ax,ay,bx,by,e:o.e??0.45,r:o.r??2,kick:o.kick||0};segs.push(s);return s}
const ARC={cx:270,cy:260,r:240};
seg(30,BOT+700,30,ARC.cy);
for(let i=0;i<28;i++){const a1=Math.PI+i/28*Math.PI,a2=Math.PI+(i+1)/28*Math.PI;seg(ARC.cx+Math.cos(a1)*ARC.r,ARC.cy+Math.sin(a1)*ARC.r,ARC.cx+Math.cos(a2)*ARC.r,ARC.cy+Math.sin(a2)*ARC.r)}
seg(510,ARC.cy,510,WH);
seg(475,BOT+310,475,WH,{r:5});
const gate=seg(468,BOT+315,510,BOT+283,{e:.3,r:1});gate.oneWay=1;
seg(30,BOT+685,173,BOT+850);seg(475,BOT+685,332,BOT+850);
seg(163,BOT+872,163,WH);seg(342,BOT+872,342,WH);
const slings=[];
function sling(A,B,C,side){const s={A,B,C,side,hit:0};s.k=seg(A[0],A[1],C[0],C[1],{kick:1,e:.5});s.k.sl=s;seg(A[0],A[1],B[0],B[1],{e:.35});seg(B[0],B[1],C[0],C[1],{e:.35});slings.push(s)}
sling([131,BOT+702],[131,BOT+760],[178,BOT+814],'L');
sling([374,BOT+702],[374,BOT+760],[327,BOT+814],'R');
/* orbite (étage haut) */
const IN={r:196,a0:Math.PI,a1:Math.PI*1.72};
seg(74,585,74,ARC.cy,{r:3});
for(let i=0;i<22;i++){const a1=IN.a0+(IN.a1-IN.a0)*i/22,a2=IN.a0+(IN.a1-IN.a0)*(i+1)/22;seg(ARC.cx+Math.cos(a1)*IN.r,ARC.cy+Math.sin(a1)*IN.r,ARC.cx+Math.cos(a2)*IN.r,ARC.cy+Math.sin(a2)*IN.r,{r:3})}
const LANES={xs:[212,257,302,347],y0:120,y1:160,lit:[false,false,false],occ:[false,false,false]};
LANES.xs.forEach(x=>seg(x,LANES.y0,x,LANES.y1,{r:3}));
/* étages flottants */
const TIERS=[900,1840];
const FLOOR_WEAR=12,FLOOR_OFF=8;
const guides=[];
const floors=[];TIERS.forEach((ty,ti)=>{guides.push(seg(145,ty-56,201,ty-10,{r:3}),seg(395,ty-56,339,ty-10,{r:3}));for(const f of[seg(30,ty-151,145,ty-56,{r:2,e:.3}),seg(510,ty-151,395,ty-56,{r:2,e:.3})]){f.oneWay=2;f.tier=ti;f.wear=0;f.off=0;f.pop=0;floors.push(f)}});
const bumpers=[{x:235,y:250},{x:320,y:250},{x:278,y:325},{x:200,y:BOT+330},{x:340,y:BOT+330}].map((b,i)=>({...b,r:25,hit:0,rot:i,spike:0}));
const posts=[];
const OBST=[{x:278,y:275,r:78},{x:200,y:BOT+330,r:31},{x:340,y:BOT+330,r:31}];
const mkFlip=(px,py,len,side,r0=.52,u0=-.5)=>({px,py,len,side,rest:side==='L'?r0:Math.PI-r0,up:side==='L'?u0:Math.PI-u0,ang:side==='L'?r0:Math.PI-r0,w:0,on:false});
const flippers=[mkFlip(170,BOT+860,70,'L'),mkFlip(335,BOT+860,70,'R'),...TIERS.flatMap(ty=>[mkFlip(200,ty,60,'L'),mkFlip(340,ty,60,'R')]),mkFlip(40,1500,56,'L',.85,-.35),mkFlip(500,1150,56,'R',.85,-.35),mkFlip(40,2250,56,'L',.85,-.35),mkFlip(466,2390,56,'R',.85,-.35)];
const kickers=[[31,1240,1370,1],[509,1460,1590,-1],[509,560,680,-1]].map(([x,y0,y1,d])=>{const k={x,y0,y1,d,hit:0};const sg=seg(x,y0,x,y1,{kick:1,e:.5});sg.sl=k;return k});
const plunger={y:BOT+930,base:BOT+930,charge:0,charging:false};
const plungerSeg=seg(475,BOT+930,510,BOT+930,{e:.1,r:1});
const saucers=[{x:120,y:450,kind:'boum',hold:0,cd:0,ball:null},{x:110,y:1450,kind:'laser',hold:0,cd:0,ball:null},{x:100,y:BOT+480,kind:'lift',hold:0,cd:0,ball:null}];
const spinner={x:52,y:540,a:0,w:0,acc:0,inside:false};
let DANGER=BOT+705;const DANGER0=DANGER;let dangerT=DANGER0;

/* ================= État ================= */
const mkBall=(x,y,vx=0,vy=0)=>({x,y,vx,vy,rot:0,trail:[]});
let ball=mkBall(492.5,plunger.base-BR-1),balls=[ball];
let state='ready',score=0,best=0,shake=0,parts=[],pops=[],stuckT=0,camY=WH-VH,gt=0;
try{best=+localStorage.getItem('flipper2-best')||0}catch(e){}
function resetBall(){ball=mkBall(492.5,plunger.base-BR-1);balls=[ball,...balls.filter(b=>b.hunter)];saucers.forEach(s=>{s.ball=null;s.hold=0});state='ready'}

/* ================= Audio ================= */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type='triangle',v=.3,slide=0){if(!ac||P.sound<=0)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(v*P.sound,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
function rustle(d=.06,v=.25,hp=1800){if(!ac||P.sound<=0)return;const t=ac.currentTime,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='highpass';f.frequency.value=hp;g.gain.value=v*P.sound;s.buffer=b;s.connect(f).connect(g).connect(ac.destination);s.start(t)}
let sndBudget=0;const sfx=(fn)=>{if(sndBudget<6){sndBudget++;fn()}};

/* ================= Effets ================= */
const CONF=['#2de2e6','#ff2975','#fdfd2f','#b388ff'];
function burst(x,y,n,spd=1,col){if(parts.length>650)n=Math.min(n,3);for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(60+Math.random()*260)*spd;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,rot:Math.random()*TAU,vr:(Math.random()-.5)*14,life:.6+Math.random()*.5,max:1.1,c:col&&Math.random()<.65?col:CONF[i%4],s:3+Math.random()*3,g:500})}}
function pop(x,y,txt,col,size){if(pops.length>60)pops.shift();pops.push({x,y,txt,col,size,life:.9})}
function addScore(n,x,y){score+=n;if(x!==undefined)pop(x,y,'+'+n)}
let banner=null;const say=(txt,sub,t=1.8)=>{banner={txt,sub,t,max:t}};
const onScreen=(y,m=60)=>y>camY-m&&y<camY+VH+m;

/* ================= Physique ================= */
function collideSeg(s){
  const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy;
  let t=((ball.x-s.ax)*dx+(ball.y-s.ay)*dy)/l2;t=t<0?0:t>1?1:t;
  const cx=s.ax+dx*t,cy=s.ay+dy*t;let nx=ball.x-cx,ny=ball.y-cy;const d=Math.hypot(nx,ny),R=BR+s.r;
  if(d>=R||d===0)return 0;if(s.oneWay===1&&(ball.vy<0||ball.y>s.ay+2))return 0;if(s.oneWay===2){if(s.off>0||ball.vy<=0)return 0;let ux=s.by-s.ay,uy=-(s.bx-s.ax);if(uy>0){ux=-ux;uy=-uy}if((ball.x-s.ax)*ux+(ball.y-s.ay)*uy<0)return 0}nx/=d;ny/=d;ball.x=cx+nx*R;ball.y=cy+ny*R;
  const vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){ball.vx-=(1+s.e)*vn*nx;ball.vy-=(1+s.e)*vn*ny;
    if(s.kick&&-vn>60){ball.vx+=nx*P.slingKick;ball.vy+=ny*P.slingKick;s.sl.hit=1;addScore(10,cx,cy);burst(cx,cy,8,.7);shake=Math.max(shake,3);sfx(()=>{tone(330,.08,'square',.12);rustle(.05,.2)})}
    else if(-vn>250)sfx(()=>rustle(.03,Math.min(.18,-vn/6000),2500));return -vn}
  return 0}
function collideCircle(c,kick){
  const dx=ball.x-c.x,dy=ball.y-c.y,d=Math.hypot(dx,dy),R=BR+c.r;
  if(d>=R||d===0)return false;const nx=dx/d,ny=dy/d;ball.x=c.x+nx*R;ball.y=c.y+ny*R;
  const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.5*vn*nx;ball.vy-=1.5*vn*ny;if(kick){ball.vx+=nx*kick;ball.vy+=ny*kick}return true}return false}
function moveFlipper(f,dt){const sp=P.flipSpeed*(1+.12*U.flipPower),tgt=f.on?f.up:f.rest,max=(f.on?sp:sp*.55)*dt;let d=tgt-f.ang;d=d>max?max:d<-max?-max:d;f.ang+=d;f.w=d/dt}
function collideFlipper(f){
  if(Math.abs(ball.y-f.py)>f.len+30||Math.abs(ball.x-f.px)>f.len+30)return;
  const tx=f.px+Math.cos(f.ang)*f.len,ty=f.py+Math.sin(f.ang)*f.len,dx=tx-f.px,dy=ty-f.py;
  let t=((ball.x-f.px)*dx+(ball.y-f.py)*dy)/(f.len*f.len);t=t<0?0:t>1?1:t;
  const cx=f.px+dx*t,cy=f.py+dy*t,rf=11-5*t;let nx=ball.x-cx,ny=ball.y-cy;const dist=Math.hypot(nx,ny),R=BR+rf;
  if(dist>=R||dist===0)return;nx/=dist;ny/=dist;ball.x=cx+nx*R;ball.y=cy+ny*R;
  const rx=cx-f.px,ry=cy-f.py,svx=-f.w*ry,svy=f.w*rx;let rvx=ball.vx-svx,rvy=ball.vy-svy;const vn=rvx*nx+rvy*ny;
  if(vn<0){rvx-=(1+P.flipBounce)*vn*nx;rvy-=(1+P.flipBounce)*vn*ny;ball.vx=rvx+svx;ball.vy=rvy+svy;if(Math.abs(f.w)>3&&-vn>300){shake=Math.max(shake,2);if(f.on&&U.shock&&shockCd<=0&&state!=='over')shockWave(f)}}}
function apron(ax,ay,bx,by){if(ball.x<=ax||ball.x>=bx)return;const ly=ay+(ball.x-ax)/(bx-ax)*(by-ay);if(ball.y<=ly||ball.y>ly+60)return;
  let nx=by-ay,ny=-(bx-ax);if(ny>0){nx=-nx;ny=-ny}const l=Math.hypot(nx,ny);nx/=l;ny/=l;const pen=(ball.y-ly)*(-ny)+BR+2;ball.x+=nx*pen;ball.y+=ny*pen;const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.4*vn*nx;ball.vy-=1.4*vn*ny}}
function physics(dt){
  if(plunger.charging)plunger.charge=Math.min(1,plunger.charge+dt*0.9);
  const py=plunger.charging?plunger.base+plunger.charge*26:plunger.base;plunger.y+=(py-plunger.y)*Math.min(1,dt*(plunger.charging?6:60));plungerSeg.ay=plungerSeg.by=plunger.y;
  flippers.forEach(f=>moveFlipper(f,dt));
  for(const s of saucers)if(s.hold>0){s.hold-=dt;if(s.hold<=0&&s.ball){const b=s.ball;b.vx=360+Math.random()*120;b.vy=-1000;b.y-=4;s.cd=1.2;s.ball=null;if(s.kind==='lift'){b.vx=(Math.random()-.5)*60;b.vy=-2000;rings.push({x:s.x,y:s.y,r:60,t:.3,max:.3,col:'42,157,143'});tone(300,.4,'triangle',.18,3);rustle(.2,.3,600)}else s.kind==='boum'?saucerBlast(s):fireLaser(s)}}
  for(const b of balls){ball=b;ballPhysics(dt)}ball=balls[0]||ball}
function ballPhysics(dt){
  for(const s of saucers)if(s.ball===ball&&s.hold>0){ball.x=s.x;ball.y=s.y;ball.vx=ball.vy=0;return}
  if(ball.hunter){let tg=null,bd=1e9;for(const e of enemies){if(e.dead||e.spawn<.6)continue;const d=Math.hypot(e.x-ball.x,e.y-ball.y);if(d<bd){bd=d;tg=e}}
    ball.vy+=P.gravity*.25*dt;if(tg){ball.vx+=(tg.x-ball.x)/bd*1400*dt;ball.vy+=(tg.y-ball.y)/bd*1400*dt}else ball.vy+=P.gravity*.5*dt;
    const hs=Math.hypot(ball.vx,ball.vy);if(hs<520&&hs>0){ball.vx*=520/hs;ball.vy*=520/hs}if(hs>1100){ball.vx*=1100/hs;ball.vy*=1100/hs}}
  else ball.vy+=P.gravity*dt;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  let sp=Math.hypot(ball.vx,ball.vy);if(sp>2000){ball.vx*=2000/sp;ball.vy*=2000/sp}
  flippers.forEach(collideFlipper);
  for(const s of segs){if(Math.abs((s.ay+s.by)/2-ball.y)>Math.abs(s.by-s.ay)/2+40)continue;collideSeg(s)}
  for(const b of bumpers){if(Math.abs(b.y-ball.y)>60)continue;if(collideCircle(b,P.bumperKick))bumperHit(b)}
  for(const p of posts)if(Math.abs(p.y-ball.y)<30&&collideCircle(p,0))sfx(()=>rustle(.03,.12,3000));
  for(const e of enemies)if(Math.abs(e.y-ball.y)<e.r+BR+4)collideEnemy(e);
  for(const s of saucers)if(s.cd<=0&&s.hold<=0&&Math.hypot(ball.x-s.x,ball.y-s.y)<11&&Math.hypot(ball.vx,ball.vy)<1400){s.hold=s.kind==='laser'?.7:s.kind==='lift'?.45:.9;s.ball=ball;tone(200,.25,'triangle',.2,.5);rustle(.1,.25,600)}
  if(ball.y<200)for(let i=0;i<3;i++){const cx=(LANES.xs[i]+LANES.xs[i+1])/2,inside=Math.abs(ball.x-cx)<19&&ball.y>LANES.y0&&ball.y<LANES.y1;
    if(inside&&!LANES.occ[i]){LANES.occ[i]=true;if(!LANES.lit[i]){LANES.lit[i]=true;addScore(50,cx,LANES.y0-26);tone(700+i*120,.08,'triangle',.15);if(LANES.lit.every(Boolean))lanesDone()}}else if(!inside&&ball===balls[0])LANES.occ[i]=false}
  const insp=ball.x<74&&ball.y>528&&ball.y<552;if(insp&&!spinner.inside){spinner.w+=Math.abs(ball.vy)*.035;orbit.a=gt;checkOrbit()}if(ball===balls[0])spinner.inside=insp;
  if(ball.y<140&&ball.x>370){const d=Math.hypot(ball.x-ARC.cx,ball.y-ARC.cy);if(d>IN.r&&d<ARC.r){orbit.b=gt;checkOrbit()}}
  for(let i=stars.length-1;i>=0;i--){const st=stars[i];if(Math.abs(st.y-ball.y)<30&&Math.hypot(st.x-ball.x,st.y-ball.y)<BR+12)collectStar(i)}
  if(ball.y>BOT+600){apron(30,BOT+685,173,BOT+850);apron(332,BOT+850,475,BOT+685)}
  sp=Math.hypot(ball.vx,ball.vy);if(sp>2000){ball.vx*=2000/sp;ball.vy*=2000/sp}
  ball.rot+=ball.vx*dt/BR}
function foldFloor(f,dur=FLOOR_OFF){f.off=f.offMax=dur;f.wear=0;f.pop=1;const mx=(f.ax+f.bx)/2,my=(f.ay+f.by)/2;for(let k=0;k<14;k++){const u=k/13;parts.push({x:f.ax+(f.bx-f.ax)*u,y:f.ay+(f.by-f.ay)*u,vx:(Math.random()-.5)*80,vy:-40-Math.random()*80,rot:Math.random()*TAU,vr:(Math.random()-.5)*10,life:.8,max:.9,c:'#fffaf0',s:5,g:500})}if(f.ax<270)pop(270,my-20,'Plancher désactivé !',PAL.navy,16);rustle(.25,.35,700);tone(220,.3,'triangle',.15,.5)}
function launch(){const c=plunger.charge;plunger.charging=false;plunger.charge=0;
  if(ball.x>475&&ball.y>plunger.base-BR-14){ball.vy=-(800+1050*c);ball.vx=0;tone(180+c*300,.18,'sawtooth',.12,2.2);rustle(.12,.25,800)}}
